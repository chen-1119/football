services:
  - type: web
    name: football-analysis-web
    runtime: node
    plan: free
    buildCommand: cd football-analysis-web && npm ci --include-workspace-root
    startCommand: cd football-analysis-web && npm start
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: REFRESH_MINUTES
        value: 30
      - key: LIVE_REFRESH_SECONDS
        value: 1800
      - key: DATA_PROVIDER
        value: auto
      - key: THESPORTSDB_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUD_SNAPSHOT_TABLE
        value: football_snapshots
      - key: CLOUD_SNAPSHOT_ID
        value: latest
      - key: CLOUD_FIXTURE_WINDOW_DAYS
        value: 1
      - key: SPORTTERY_PAGE_SIZE
        value: 80
      - key: SPORTTERY_PAGE_DEPTH
        value: 16
      - key: DETAIL_ENRICH_LIMIT
        value: 60
      - key: ADMIN_SYNC_TOKEN
        generateValue: true
