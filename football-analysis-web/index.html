<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>足球赛事分析平台</title>
  <meta name="description" content="基于中国体育彩票赛程数据的足球赛事分析平台，支持五分钟刷新、模型选择与价格测算。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20260428-5" />
</head>
<body data-theme="light">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-orb orb-c"></div>

  <header class="app-header">
    <div>
      <p class="brand-kicker">SPORTTERY DATA + AI</p>
      <h1>足球赛事分析平台</h1>
      <p class="brand-sub">默认每 5 分钟同步一次官方数据，仅用于数据研究展示</p>
    </div>
    <button id="theme-toggle" class="ghost-btn" type="button">切换主题</button>
  </header>

  <main id="app" class="app-main" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-btn is-active" data-action="nav" data-page="home" type="button">
      <span class="nav-icon">●</span>
      <span>首页</span>
    </button>
    <button class="nav-btn" data-action="nav" data-page="models" type="button">
      <span class="nav-icon">AI</span>
      <span>模型</span>
    </button>
    <button class="nav-btn" data-action="nav" data-page="matches" type="button">
      <span class="nav-icon">◉</span>
      <span>比赛</span>
    </button>
    <button class="nav-btn" data-action="nav" data-page="favorites" type="button">
      <span class="nav-icon">♡</span>
      <span>关注</span>
    </button>
    <button class="nav-btn" data-action="nav" data-page="search" type="button">
      <span class="nav-icon">⌕</span>
      <span>搜索</span>
    </button>
  </nav>

  <script>
    if (window.location.protocol === "file:") {
      window.location.replace("http://127.0.0.1:8787/");
    }
  </script>
  <script defer src="./app.js?v=20260428-5"></script>
</body>
</html>
