name: Refresh Render Cache

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-render-cache
  cancel-in-progress: true

jobs:
  sync-sporttery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Sporttery and import snapshot
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        working-directory: football-analysis-web
        run: |
          if [ -z "$RENDER_BASE_URL" ] || [ -z "$ADMIN_SYNC_TOKEN" ]; then
            echo "Set repository secrets RENDER_BASE_URL and ADMIN_SYNC_TOKEN to enable Sporttery cloud sync."
            exit 0
          fi
          node scripts/cloud-sync-sporttery.js

  refresh:
    runs-on: ubuntu-latest
    needs: sync-sporttery
    if: always()
    steps:
      - name: Wake Render and start refresh
        env:
          RENDER_REFRESH_URL: ${{ secrets.RENDER_REFRESH_URL }}
        run: |
          if [ -z "$RENDER_REFRESH_URL" ]; then
            echo "Set repository secret RENDER_REFRESH_URL, for example: https://football-analysis-web.onrender.com/api/refresh"
            exit 0
          fi
          curl --fail --show-error --silent --max-time 90 -X POST "$RENDER_REFRESH_URL"
